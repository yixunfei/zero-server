name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

jobs:
  stage0:
    name: Stage 0 Local Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run full local acceptance
        run: java scripts/ZeroStage0Acceptance.java --level full --timeoutSeconds 900

      - name: Upload acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-acceptance-logs
          path: target/stage0-acceptance/logs
          if-no-files-found: warn
          retention-days: 7
