name: CI

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility-gate:
    name: API compatibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build protected API modules
        run: ./mvnw -B -ntp -DskipTests -pl zero-core,zero-runtime,zero-protocol,zero-rpc-common,zero-data -am install
      - name: Verify API surface and consumer
        run: |
          mkdir -p target/api-compatibility
          java scripts/VerifyPublicApiCompatibility.java --check | tee target/api-compatibility/api-gate.log
          java scripts/VerifyApiCompatibilityConsumer.java | tee target/api-compatibility/consumer.log
      - name: Upload API compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-compatibility
          path: target/api-compatibility

  acceptance-evidence:
    name: Acceptance evidence bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Collect repository and local acceptance evidence
        run: java scripts/ZeroAcceptanceEvidence.java --level full --local-only --no-stage0
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-evidence
          path: target/acceptance-evidence
          if-no-files-found: error
          retention-days: 14

  unit:
    name: Unit and default tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate Maven model
        run: ./mvnw -B -ntp -DskipTests validate
      - name: Run unit tests
        run: ./mvnw -B -ntp test

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run quality profile
        run: ./mvnw -B -ntp -Pquality verify
      - name: Verify codegen modes and failure exits
        run: java scripts/VerifyCodegenModes.java

  integration:
    name: Local integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run local integration profile
        run: ./mvnw -B -ntp -Pintegration-tests verify

  architecture:
    name: Architecture and repository evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run architecture guard
        run: java scripts/ZeroArchitectureGuard.java
      - name: Verify dependency guard positive and negative fixtures
        run: java scripts/VerifyDependencyGuard.java
      - name: Verify framework gap ledger
        run: java scripts/ZeroFrameworkGapLedger.java
      - name: Verify release readiness materials
        run: java scripts/ZeroReleaseHardeningReadiness.java

  stage0:
    name: Full local framework acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unified Stage 0 acceptance
        run: java scripts/ZeroStage0Acceptance.java --level full
      - name: Upload Stage 0 logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage0-acceptance-logs
          path: target/stage0-acceptance/logs
          if-no-files-found: ignore
          retention-days: 7

  cross-platform-entry:
    name: Unified entry smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare POSIX scripts
        if: runner.os != 'Windows'
        run: chmod +x mvnw scripts/zero.sh
      - name: Verify Maven Wrapper on POSIX
        if: runner.os != 'Windows'
        run: ./mvnw -N -B -ntp validate
      - name: Run full unified entry smoke on POSIX
        if: runner.os != 'Windows'
        run: |
          set -euxo pipefail
          chmod +x scripts/zero.sh
          java -version
          ./mvnw -version
          ./mvnw -B -ntp -DskipTests install
          mkdir -p target/cross-platform
          ZERO_MAVEN_CMD=mvn java scripts/ZeroUnifiedEntryVerifier.java --full-smoke > target/cross-platform/posix-verifier.log
      - name: Run full unified entry smoke on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:ZERO_MAVEN_CMD = 'mvn.cmd'
          java -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./mvnw -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./mvnw -B -ntp -DskipTests install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mkdir target\cross-platform -Force
          java scripts\ZeroUnifiedEntryVerifier.java --full-smoke *>&1 | Tee-Object -FilePath target\cross-platform\windows-verifier.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload cross-platform evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-entry-${{ matrix.os }}
          path: target/cross-platform
          if-no-files-found: ignore

  platform-transaction:
    name: Platform transaction gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Use a real temporary directory on macOS
        if: runner.os == 'macOS'
        run: |
          # macOS /var aliases /private/var; scaffold transactions intentionally reject symlink ancestors.
          echo "JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=$(cd "$RUNNER_TEMP" && pwd -P)" >> "$GITHUB_ENV"
      - name: Run platform transaction gate
        shell: bash
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then chmod +x mvnw; export ZERO_MAVEN_CMD=./mvnw; else export ZERO_MAVEN_CMD=mvnw.cmd; fi
          mkdir -p target/production-gate
          java scripts/ZeroPlatformProductionGate.java --platform-transaction
      - name: Upload platform transaction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-transaction-${{ matrix.os }}
          path: target/production-gate
          if-no-files-found: error
          retention-days: 14

  performance:
    name: Performance evidence (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_performance == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run opt-in benchmark profile
        run: ./mvnw -B -ntp -Pbenchmarks verify

  external:
    name: External middleware (opt-in, no implicit Docker)
    if: github.event_name == 'workflow_dispatch' && inputs.run_external == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run explicitly provisioned external environment
        run: ./mvnw -B -ntp -Pexternal-tests verify
        env:
          EXTERNAL_MIDDLEWARE_ENDPOINTS: ${{ secrets.EXTERNAL_MIDDLEWARE_ENDPOINTS }}

  release-artifact-evidence:
    name: Local release artifact evidence (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_release_evidence == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate local artifact, SBOM and rollback rehearsal
        run: |
          mkdir -p target/release-evidence
          java scripts/ZeroReleaseArtifactEvidence.java | tee target/release-evidence/run.log
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-artifact-evidence
          path: target/acceptance-evidence/release-artifact
          if-no-files-found: error
          retention-days: 14

'on':
  push:
    branches:
      - master
      - main
      - 'codex/**'
      - 'zero/**'
      - 'feat/modular-runtime-composition'
  pull_request:
  workflow_dispatch:
    inputs:
      run_external:
        description: Run external middleware tests against a separately provisioned environment
        required: true
        default: false
        type: boolean
      run_performance:
        description: Run opt-in benchmark evidence
        required: true
        default: false
        type: boolean
      run_release_evidence:
        description: Generate local artifact, SBOM, signature fixture and rollback rehearsal
        required: true
        default: false
        type: boolean
