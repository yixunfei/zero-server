name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Maven Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate
        run: mvn -B -ntp -DskipTests validate

      - name: Test
        run: mvn -B -ntp test

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Quality
        run: mvn -B -ntp -Pquality verify

  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run local doctor
        run: java scripts/ZeroLocalDoctor.java

      - name: Install local snapshots
        run: mvn -B -ntp -DskipTests install

      - name: Test RPG minimal example
        run: mvn -B -ntp -f examples/rpg-minimal/pom.xml test

      - name: Run RPG minimal example
        run: mvn -B -ntp -f examples/rpg-minimal/pom.xml exec:java

      - name: Run RPG protocol example
        run: mvn -B -ntp -f examples/rpg-minimal/pom.xml "-Dexec.mainClass=group.zn.zero.examples.rpg.RpgProtocolApplication" exec:java

      - name: Test RPG TCP generated example
        run: mvn -B -ntp -f examples/rpg-tcp-generated/pom.xml test

      - name: Run RPG TCP generated example
        run: mvn -B -ntp -f examples/rpg-tcp-generated/pom.xml exec:java

      - name: Verify local game scaffolds
        run: java scripts/VerifyLocalScaffolds.java --outputDir target/scaffold-ci
